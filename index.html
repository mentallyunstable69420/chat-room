```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5865f2">
  <title>Chat Room</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --background: #0b0d12;
      --sidebar: #11141b;
      --panel: #171a22;
      --panel-hover: #1d212b;
      --input: #20242e;
      --border: #292e3a;
      --text: #f5f7fa;
      --muted: #9299a8;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --green: #23c552;
      --danger: #ed4245;
      --message-hover: rgba(255,255,255,0.025);
    }

    body.light {
      --background: #f5f6f8;
      --sidebar: #ffffff;
      --panel: #ffffff;
      --panel-hover: #f0f1f4;
      --input: #f0f1f4;
      --border: #dfe2e7;
      --text: #17191f;
      --muted: #6b7280;
      --message-hover: rgba(0,0,0,0.025);
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    .app {
      height: 100vh;
      width: 100%;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 220px;
    }

    /* =========================
       LEFT SIDEBAR
    ========================= */

    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 24px;
      font-size: 20px;
      font-weight: 800;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      display: grid;
      place-items: center;
      font-size: 17px;
    }

    .section-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0 10px 8px;
    }

    .room {
      width: 100%;
      border: 0;
      background: var(--accent);
      color: white;
      border-radius: 8px;
      padding: 11px 12px;
      text-align: left;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .room-icon {
      opacity: 0.8;
    }

    .sidebar-bottom {
      margin-top: auto;
    }

    .theme-button {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      text-align: left;
    }

    .theme-button:hover {
      background: var(--panel-hover);
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    .chat-header {
      min-height: 68px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
    }

    .room-name {
      font-size: 17px;
      font-weight: 750;
    }

    .room-description {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .online-badge {
      color: var(--muted);
      font-size: 12px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .empty-state {
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      padding: 40px;
    }

    .empty-state-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .empty-state h2 {
      color: var(--text);
      font-size: 20px;
      margin-bottom: 6px;
    }

    .message {
      display: flex;
      gap: 12px;
      padding: 7px 10px;
      margin: 0 -10px;
      border-radius: 8px;
    }

    .message:hover {
      background: var(--message-hover);
    }

    .avatar {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-size: 14px;
      font-weight: 800;
      background: var(--accent);
    }

    .message-main {
      min-width: 0;
      flex: 1;
    }

    .message-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 3px;
    }

    .username {
      font-size: 14px;
      font-weight: 750;
    }

    .timestamp {
      color: var(--muted);
      font-size: 10px;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.55;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .delete-message {
      opacity: 0;
      align-self: center;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 5px;
      border-radius: 5px;
    }

    .message:hover .delete-message {
      opacity: 1;
    }

    .delete-message:hover {
      color: var(--danger);
      background: var(--panel-hover);
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer {
      border-top: 1px solid var(--border);
      padding: 14px 20px 18px;
    }

    .composer-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 11px;
      font-size: 14px;
    }

    #messageInput::placeholder {
      color: var(--muted);
    }

    #sendButton {
      border: 0;
      background: var(--accent);
      color: white;
      padding: 9px 16px;
      border-radius: 7px;
      font-weight: 700;
    }

    #sendButton:hover {
      background: var(--accent-hover);
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================
       RIGHT USERS
    ========================= */

    .users {
      background: var(--sidebar);
      border-left: 1px solid var(--border);
      padding: 20px 15px;
      overflow-y: auto;
    }

    .users-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 4px;
      border-radius: 6px;
    }

    .user:hover {
      background: var(--panel-hover);
    }

    .user-status {
      position: relative;
      width: 9px;
      height: 9px;
      background: var(--green);
      border-radius: 50%;
    }

    .user-status::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 1px solid var(--sidebar);
    }

    .user-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .you {
      color: var(--muted);
      font-size: 10px;
      margin-left: auto;
    }

    /* =========================
       MODAL
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .modal {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .modal-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: white;
      font-size: 23px;
      margin-bottom: 17px;
    }

    .modal h1 {
      font-size: 23px;
      margin-bottom: 7px;
    }

    .modal p {
      color: var(--muted);
      line-height: 1.5;
      font-size: 13px;
      margin-bottom: 20px;
    }

    #usernameInput {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      outline: 0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    #usernameInput:focus {
      border-color: var(--accent);
    }

    #joinButton {
      width: 100%;
      border: 0;
      background: var(--accent);
      color: white;
      border-radius: 8px;
      padding: 12px;
      font-weight: 750;
    }

    #joinButton:hover {
      background: var(--accent-hover);
    }

    .username-error {
      color: var(--danger);
      font-size: 12px;
      min-height: 18px;
      margin-bottom: 7px;
    }

    /* =========================
       SCROLLBAR
    ========================= */

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar,
      .users {
        display: none;
      }

      .chat {
        height: 100vh;
      }

      .chat-header {
        padding: 0 15px;
      }

      .messages {
        padding: 15px;
      }

      .composer {
        padding: 10px;
      }

      .online-badge {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       USERNAME MODAL
  ========================== -->

  <div class="overlay" id="usernameOverlay">
    <div class="modal">

      <div class="modal-icon">💬</div>

      <h1>Welcome to Chat</h1>

      <p>
        Choose a username to enter the room.
        Your username is saved on this device.
      </p>

      <input
        id="usernameInput"
        type="text"
        maxlength="20"
        autocomplete="off"
        placeholder="Enter your username"
      >

      <div class="username-error" id="usernameError"></div>

      <button id="joinButton">
        Enter Chat
      </button>

    </div>
  </div>


  <!-- =========================
       MAIN APPLICATION
  ========================== -->

  <div class="app">

    <!-- LEFT SIDEBAR -->

    <aside class="sidebar">

      <div class="brand">
        <div class="brand-icon">💬</div>
        <span>ChatRoom</span>
      </div>

      <div class="section-label">
        Rooms
      </div>

      <button class="room">
        <span class="room-icon">#</span>
        <span>general</span>
      </button>

      <div class="sidebar-bottom">

        <button class="theme-button" id="themeButton">
          🌙 &nbsp; Toggle theme
        </button>

      </div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

      <header class="chat-header">

        <div>
          <div class="room-name">
            # general
          </div>

          <div class="room-description">
            The main chat room
          </div>
        </div>

        <div class="online-badge">
          🟢 <span id="onlineCount">1</span> online
        </div>

      </header>


      <!-- MESSAGES -->

      <section
        class="messages"
        id="messages"
        aria-live="polite"
      ></section>


      <!-- MESSAGE COMPOSER -->

      <form class="composer" id="messageForm">

        <div class="composer-box">

          <input
            id="messageInput"
            type="text"
            maxlength="500"
            autocomplete="off"
            placeholder="Message #general..."
          >

          <button
            id="sendButton"
            type="submit"
          >
            Send
          </button>

        </div>

      </form>

    </main>


    <!-- USERS -->

    <aside class="users">

      <div class="users-title">
        Online — <span id="userCount">1</span>
      </div>

      <div id="userList"></div>

    </aside>

  </div>


  <script>
    /*
      =========================================================
      CHAT ROOM
      =========================================================

      This is a COMPLETE standalone frontend.

      IMPORTANT:
      GitHub Pages and Cloudflare Pages are static hosting.
      They do NOT automatically provide a shared database.

      Therefore this version stores messages in the visitor's
      browser using localStorage.

      If you want a REAL shared chat where different people
      see the same messages, you will need to connect this
      frontend to a database/backend.
    */


    /* ========================================================
       ELEMENTS
    ======================================================== */

    const usernameOverlay =
      document.getElementById("usernameOverlay");

    const usernameInput =
      document.getElementById("usernameInput");

    const usernameError =
      document.getElementById("usernameError");

    const joinButton =
      document.getElementById("joinButton");

    const messagesElement =
      document.getElementById("messages");

    const messageForm =
      document.getElementById("messageForm");

    const messageInput =
      document.getElementById("messageInput");

    const userList =
      document.getElementById("userList");

    const userCount =
      document.getElementById("userCount");

    const onlineCount =
      document.getElementById("onlineCount");

    const themeButton =
      document.getElementById("themeButton");


    /* ========================================================
       STATE
    ======================================================== */

    let username =
      localStorage.getItem("chat_username") || "";

    let chatMessages =
      JSON.parse(
        localStorage.getItem("chat_messages") || "[]"
      );


    /* ========================================================
       SECURITY
       ======================================================== */

    function escapeHTML(text) {

      const element =
        document.createElement("div");

      element.textContent = text;

      return element.innerHTML;
    }


    /* ========================================================
       USERNAME
    ======================================================== */

    function showUsernameModal() {

      usernameOverlay.style.display = "flex";

      setTimeout(() => {
        usernameInput.focus();
      }, 100);
    }


    function hideUsernameModal() {

      usernameOverlay.style.display = "none";

      messageInput.focus();
    }


    function joinChat() {

      const name =
        usernameInput.value.trim();

      usernameError.textContent = "";

      if (!name) {

        usernameError.textContent =
          "Please enter a username.";

        usernameInput.focus();

        return;
      }


      if (name.length < 2) {

        usernameError.textContent =
          "Username must be at least 2 characters.";

        usernameInput.focus();

        return;
      }


      username = name;

      localStorage.setItem(
        "chat_username",
        username
      );

      hideUsernameModal();

      updateUsers();
    }


    joinButton.addEventListener(
      "click",
      joinChat
    );


    usernameInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          joinChat();
        }

      }
    );


    /* ========================================================
       TIME
    ======================================================== */

    function getTime() {

      return new Intl.DateTimeFormat(
        [],
        {
          hour: "numeric",
          minute: "2-digit"
        }
      ).format(new Date());

    }


    /* ========================================================
       DATE
    ======================================================== */

    function getFullTime() {

      return new Intl.DateTimeFormat(
        [],
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      ).format(new Date());

    }


    /* ========================================================
       SAVE MESSAGES
    ======================================================== */

    function saveMessages() {

      localStorage.setItem(
        "chat_messages",
        JSON.stringify(chatMessages)
      );

    }


    /* ========================================================
       RENDER MESSAGES
    ======================================================== */

    function renderMessages() {

      messagesElement.innerHTML = "";


      if (chatMessages.length === 0) {

        messagesElement.innerHTML = `
          <div class="empty-state">

            <div>
              <div class="empty-state-icon">
                💬
              </div>

              <h2>Welcome to #general</h2>

              <p>
                This is the beginning of the conversation.
                Send the first message!
              </p>
            </div>

          </div>
        `;

        return;
      }


      chatMessages.forEach(
        function(message, index) {

          const element =
            document.createElement("div");

          element.className = "message";


          const firstLetter =
            message.username
              .charAt(0)
              .toUpperCase();


          element.innerHTML = `

            <div class="avatar">
              ${escapeHTML(firstLetter)}
            </div>

            <div class="message-main">

              <div class="message-header">

                <span class="username">
                  ${escapeHTML(message.username)}
                </span>

                <span
                  class="timestamp"
                  title="${escapeHTML(
                    message.fullTime || ""
                  )}"
                >
                  ${escapeHTML(message.time)}
                </span>

              </div>

              <div class="message-text">
                ${escapeHTML(message.text)}
              </div>

            </div>

            ${
              message.username === username
              ? `
                <button
                  class="delete-message"
                  title="Delete message"
                  data-index="${index}"
                >
                  🗑️
                </button>
              `
              : ""
            }

          `;


          messagesElement.appendChild(element);

        }
      );


      messagesElement.scrollTop =
        messagesElement.scrollHeight;

    }


    /* ========================================================
       SEND MESSAGE
    ======================================================== */

    function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text) {
        return;
      }


      if (!username) {

        showUsernameModal();

        return;
      }


      const message = {

        username: username,

        text: text,

        time: getTime(),

        fullTime: getFullTime()

      };


      chatMessages.push(message);


      /*
        Prevent localStorage from growing forever.
        Keep the newest 200 messages.
      */

      if (chatMessages.length > 200) {

        chatMessages =
          chatMessages.slice(-200);

      }


      saveMessages();

      renderMessages();

      messageInput.value = "";

      messageInput.focus();

    }


    messageForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        sendMessage();

      }
    );


    /* ========================================================
       DELETE MESSAGE
    ======================================================== */

    messagesElement.addEventListener(
      "click",
      function(event) {

        const button =
          event.target.closest(
            ".delete-message"
          );


        if (!button) {
          return;
        }


        const index =
          Number(button.dataset.index);


        if (
          Number.isNaN(index) ||
          !chatMessages[index]
        ) {
          return;
        }


        if (
          chatMessages[index].username !== username
        ) {
          return;
        }


        chatMessages.splice(index, 1);

        saveMessages();

        renderMessages();

      }
    );


    /* ========================================================
       USERS
    ======================================================== */

    function updateUsers() {

      userList.innerHTML = "";


      /*
        These are example users for the frontend demo.

        They are NOT actually online users.

        A real online-user system requires a backend.
      */

      const users = [
        username || "You",
        "Alex",
        "Jordan",
        "Sam"
      ];


      users.forEach(
        function(user, index) {

          const element =
            document.createElement("div");

          element.className = "user";


          const isYou =
            index === 0;


          element.innerHTML = `

            <span class="user-status"></span>

            <span class="user-name">
              ${escapeHTML(user)}
            </span>

            ${
              isYou
              ? `<span class="you">you</span>`
              : ""
            }

          `;


          userList.appendChild(element);

        }
      );


      userCount.textContent =
        users.length;

      onlineCount.textContent =
        users.length;

    }


    /* ========================================================
       THEME
    ======================================================== */

    const savedTheme =
      localStorage.getItem("chat_theme");


    if (savedTheme === "light") {

      document.body.classList.add("light");

    }


    function updateThemeButton() {

      const isLight =
        document.body.classList.contains("light");


      themeButton.textContent =
        isLight
          ? "☀️   Dark mode"
          : "🌙   Light mode";

    }


    themeButton.addEventListener(
      "click",
      function() {

        document.body.classList.toggle("light");


        const theme =
          document.body.classList.contains("light")
            ? "light"
            : "dark";


        localStorage.setItem(
          "chat_theme",
          theme
        );


        updateThemeButton();

      }
    );


    /* ========================================================
       KEYBOARD SHORTCUT
    ======================================================== */

    messageInput.addEventListener(
      "keydown",
      function(event) {

        /*
          Enter sends the message.
        */

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* ========================================================
       START APPLICATION
    ======================================================== */

    if (username) {

      hideUsernameModal();

    } else {

      showUsernameModal();

    }


    renderMessages();

    updateUsers();

    updateThemeButton();

  </script>

</body>
</html>
