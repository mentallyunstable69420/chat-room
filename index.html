<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Room</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0f1115;
  --panel: #181b22;
  --panel2: #20242d;
  --border: #303541;
  --text: #f2f4f8;
  --muted: #9ca3af;
  --accent: #5865f2;
  --danger: #ed4245;
  --input: #111318;
}

body.light {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --panel2: #eef0f4;
  --border: #d5d9e0;
  --text: #17191d;
  --muted: #626875;
  --input: #f7f8fa;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  height: 100vh;
  overflow: hidden;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: flex;
  height: 100vh;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {
  width: 250px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.logo {
  padding: 18px;
  font-size: 20px;
  font-weight: bold;
  border-bottom: 1px solid var(--border);
}

.room-header {
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.room-header span {
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
}

.room-list {
  overflow-y: auto;
  padding: 0 8px 10px;
  flex: 1;
}

.room-button {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 10px 12px;
  margin-bottom: 3px;
  border-radius: 7px;
  text-align: left;
}

.room-button:hover {
  background: var(--panel2);
  color: var(--text);
}

.room-button.active {
  background: var(--panel2);
  color: var(--text);
}

.sidebar-bottom {
  padding: 10px;
  border-top: 1px solid var(--border);
}

.sidebar-bottom button {
  width: 100%;
  border: 0;
  border-radius: 7px;
  padding: 9px;
  margin-top: 5px;
  background: var(--panel2);
  color: var(--text);
}

/* =========================================================
   MAIN
   ========================================================= */

.main {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 60px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--panel);
  flex-shrink: 0;
}

.room-title {
  display: flex;
  align-items: center;
  gap: 10px;
}

.room-title strong {
  font-size: 16px;
}

.status {
  font-size: 12px;
  color: var(--muted);
}

.status.connected {
  color: #43b581;
}

.status.disconnected {
  color: var(--danger);
}

.top-actions {
  display: flex;
  gap: 6px;
}

.top-actions button {
  border: 0;
  background: var(--panel2);
  color: var(--text);
  border-radius: 7px;
  padding: 8px 10px;
}

/* =========================================================
   CHAT
   ========================================================= */

.chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 18px;
}

.message {
  display: flex;
  gap: 10px;
  padding: 7px 4px;
  border-radius: 7px;
}

.message:hover {
  background: rgba(128,128,128,.08);
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--panel2);
  object-fit: cover;
  flex-shrink: 0;
}

.avatar-placeholder {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  flex-shrink: 0;
}

.message-content {
  min-width: 0;
  flex: 1;
}

.message-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.username {
  font-weight: bold;
}

.timestamp {
  color: var(--muted);
  font-size: 11px;
}

.message-text {
  white-space: pre-wrap;
  word-break: break-word;
  margin-top: 3px;
}

.edited {
  color: var(--muted);
  font-size: 10px;
  margin-left: 4px;
}

.message-actions {
  opacity: 0;
  display: flex;
  gap: 3px;
}

.message:hover .message-actions {
  opacity: 1;
}

.message-actions button {
  border: 0;
  background: var(--panel2);
  color: var(--muted);
  border-radius: 5px;
  padding: 3px 6px;
  font-size: 11px;
}

.message-actions button:hover {
  color: var(--text);
}

.pinned {
  border-left: 3px solid var(--accent);
  padding-left: 8px;
}

/* =========================================================
   COMPOSER
   ========================================================= */

.composer-wrap {
  padding: 10px 14px 14px;
  border-top: 1px solid var(--border);
  background: var(--panel);
}

.composer {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.composer textarea {
  flex: 1;
  resize: none;
  min-height: 42px;
  max-height: 140px;
  padding: 11px 13px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--input);
  color: var(--text);
  outline: none;
}

.composer textarea:focus {
  border-color: var(--accent);
}

.send-button {
  border: 0;
  border-radius: 9px;
  background: var(--accent);
  color: white;
  padding: 11px 16px;
  height: 42px;
}

.send-button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* =========================================================
   MEMBERS
   ========================================================= */

.members {
  width: 210px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  flex-shrink: 0;
  overflow-y: auto;
}

.members-title {
  padding: 18px 14px 10px;
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
}

.member {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
}

.member-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--panel2);
}

.member-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #43b581;
}

.member-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* =========================================================
   MODALS
   ========================================================= */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(430px, 100%);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}

.modal-box h2 {
  margin-top: 0;
}

.modal-box input {
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--input);
  color: var(--text);
}

.modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.modal-buttons button {
  border: 0;
  padding: 9px 13px;
  border-radius: 7px;
  background: var(--panel2);
  color: var(--text);
}

.modal-buttons .primary {
  background: var(--accent);
  color: white;
}

/* =========================================================
   MOBILE
   ========================================================= */

.mobile-room-button {
  display: none;
}

@media (max-width: 850px) {
  .members {
    display: none;
  }

  .sidebar {
    width: 210px;
  }
}

@media (max-width: 600px) {
  .sidebar {
    display: none;
  }

  .mobile-room-button {
    display: block !important;
  }

  .topbar {
    padding: 0 9px;
  }

  .chat {
    padding: 10px;
  }

  .message-actions {
    opacity: 1;
  }

  .composer-wrap {
    padding: 7px;
  }

  .send-button {
    padding: 10px 12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =======================================================
       SIDEBAR
       ======================================================= -->

  <aside class="sidebar">

    <div class="logo">
      Chat Room
    </div>

    <div class="room-header">
      <span>Rooms</span>

      <button
        onclick="openCreateRoom()"
        title="Create room"
        style="
          border:0;
          background:var(--panel2);
          color:var(--text);
          border-radius:6px;
          padding:5px 8px;
        "
      >
        +
      </button>
    </div>

    <div
      id="roomList"
      class="room-list"
    ></div>

    <div class="sidebar-bottom">

      <button onclick="changeName()">
        Change name
      </button>

      <button onclick="changeAvatar()">
        Change avatar
      </button>

      <button onclick="toggleTheme()">
        Toggle theme
      </button>

      <button onclick="openDevLogin()">
        Developer
      </button>

    </div>

  </aside>


  <!-- =======================================================
       MAIN
       ======================================================= -->

  <main class="main">

    <header class="topbar">

      <div class="room-title">

        <button
          class="mobile-room-button"
          onclick="toggleMobileRooms()"
          style="
            border:0;
            background:var(--panel2);
            color:var(--text);
            border-radius:6px;
            padding:6px 9px;
          "
        >
          ☰
        </button>

        <strong id="roomTitle">
          General
        </strong>

        <span
          id="connectionStatus"
          class="status disconnected"
        >
          Connecting...
        </span>

      </div>

      <div class="top-actions">

        <button onclick="copyRoomCode()">
          Copy code
        </button>

      </div>

    </header>


    <section
      id="chat"
      class="chat"
    ></section>


    <div class="composer-wrap">

      <div class="composer">

        <textarea
          id="messageInput"
          placeholder="Type a message..."
          maxlength="2000"
          rows="1"
        ></textarea>

        <button
          id="sendButton"
          class="send-button"
          onclick="sendMessage()"
          disabled
        >
          Send
        </button>

      </div>

    </div>

  </main>


  <!-- =======================================================
       MEMBERS
       ======================================================= -->

  <aside class="members">

    <div class="members-title">
      Online
    </div>

    <div id="memberList"></div>

  </aside>

</div>


<!-- =========================================================
     CREATE ROOM MODAL
     ========================================================= -->

<div
  id="createRoomModal"
  class="modal"
>

  <div class="modal-box">

    <h2>Create room</h2>

    <input
      id="newRoomName"
      placeholder="Room name"
      maxlength="40"
    >

    <input
      id="newRoomCode"
      placeholder="Room code"
      maxlength="30"
    >

    <div class="modal-buttons">

      <button
        onclick="closeCreateRoom()"
      >
        Cancel
      </button>

      <button
        class="primary"
        onclick="confirmCreateRoom()"
      >
        Create
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     NAME MODAL
     ========================================================= -->

<div
  id="nameModal"
  class="modal"
>

  <div class="modal-box">

    <h2>Choose a name</h2>

    <input
      id="nameInput"
      maxlength="24"
      placeholder="Display name"
    >

    <div class="modal-buttons">

      <button
        class="primary"
        onclick="saveName()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<script>

/* ============================================================
   STATE
   ============================================================ */

let socket = null;

let reconnectTimer = null;

let reconnectDelay = 1000;

let intentionalDisconnect = false;

let currentRoom = "general";

let currentRoomName = "General";

let rooms = [];

let messages = [];

let members = [];

let username =
  localStorage.getItem("chat_username") ||
  "";

let avatar =
  localStorage.getItem("chat_avatar") ||
  "";

let theme =
  localStorage.getItem("chat_theme") ||
  "dark";

let socketHasReceivedHistory = false;

let currentlyConnecting = false;


/* ============================================================
   THEME
   ============================================================ */

if (theme === "light") {
  document.body.classList.add("light");
}


/* ============================================================
   STARTUP
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    setupInput();

    if (!username) {
      document
        .getElementById("nameModal")
        .classList.add("show");
    }

    await loadRooms();

    connectToRoom(
      currentRoom
    );
  }
);


/* ============================================================
   INPUT
   ============================================================ */

function setupInput() {

  const input =
    document.getElementById(
      "messageInput"
    );

  input.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();

        sendMessage();
      }
    }
  );

  input.addEventListener(
    "input",
    () => {

      input.style.height =
        "auto";

      input.style.height =
        Math.min(
          input.scrollHeight,
          140
        ) + "px";
    }
  );
}


/* ============================================================
   ROOMS
   ============================================================ */

async function loadRooms() {

  try {

    const response =
      await fetch(
        "/api/rooms",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "Could not load rooms"
      );
    }

    const data =
      await response.json();

    rooms =
      Array.isArray(data.rooms)
        ? data.rooms
        : [];

    if (!rooms.length) {
      rooms = [
        {
          name: "General",
          code: "general"
        }
      ];
    }

    const savedRoom =
      localStorage.getItem(
        "chat_room"
      );

    if (
      savedRoom &&
      rooms.some(
        room =>
          room.code ===
          savedRoom
      )
    ) {
      currentRoom =
        savedRoom;
    }

    const room =
      rooms.find(
        room =>
          room.code ===
          currentRoom
      );

    if (room) {
      currentRoomName =
        room.name;
    }

    renderRooms();

  } catch (error) {

    console.error(
      "Room loading error:",
      error
    );

    rooms = [
      {
        name: "General",
        code: "general"
      }
    ];

    renderRooms();
  }
}


function renderRooms() {

  const list =
    document.getElementById(
      "roomList"
    );

  list.innerHTML = "";

  for (const room of rooms) {

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "room-button" +
      (
        room.code === currentRoom
          ? " active"
          : ""
      );

    button.textContent =
      "# " + room.name;

    button.onclick =
      () => {
        joinRoom(
          room.code,
          room.name
        );
      };

    list.appendChild(button);
  }
}


/* ============================================================
   JOIN ROOM
   ============================================================ */

function joinRoom(
  code,
  name
) {

  if (
    code === currentRoom &&
    socket &&
    socket.readyState ===
      WebSocket.OPEN
  ) {
    return;
  }

  currentRoom = code;

  currentRoomName =
    name || code;

  localStorage.setItem(
    "chat_room",
    currentRoom
  );

  renderRooms();

  connectToRoom(
    currentRoom
  );
}


/* ============================================================
   WEBSOCKET CONNECTION
   ============================================================ */

function connectToRoom(
  roomCode
) {

  if (!username) {
    setStatus(
      false,
      "Choose a name"
    );

    return;
  }

  currentlyConnecting = true;

  intentionalDisconnect = false;

  clearTimeout(
    reconnectTimer
  );

  // Close old connection.
  if (socket) {

    try {
      socket.close();
    } catch {}

    socket = null;
  }

  socketHasReceivedHistory =
    false;

  messages = [];

  members = [];

  renderMessages();

  renderMembers();

  setStatus(
    false,
    "Connecting..."
  );

  const protocol =
    location.protocol ===
    "https:"
      ? "wss:"
      : "ws:";

  const params =
    new URLSearchParams();

  params.set(
    "room",
    roomCode
  );

  params.set(
    "name",
    username
  );

  params.set(
    "avatar",
    avatar
  );

  const wsUrl =
    protocol +
    "//" +
    location.host +
    "/api/ws?" +
    params.toString();

  console.log(
    "Connecting to room:",
    roomCode
  );

  try {

    socket =
      new WebSocket(
        wsUrl
      );

  } catch (error) {

    console.error(
      "WebSocket creation failed:",
      error
    );

    currentlyConnecting = false;

    scheduleReconnect();

    return;
  }


  /* ----------------------------------------------------------
     OPEN
     ---------------------------------------------------------- */

  socket.onopen = () => {

    console.log(
      "WebSocket connected:",
      roomCode
    );

    currentlyConnecting = false;

    reconnectDelay = 1000;

    setStatus(
      true,
      "Connected"
    );

    document
      .getElementById(
        "sendButton"
      )
      .disabled = false;

    /*
     * IMPORTANT:
     *
     * DO NOT call loadRoomHistory() here.
     *
     * The Durable Object sends history through the WebSocket
     * immediately after connection.
     *
     * Calling the HTTP history endpoint here could race with
     * live messages and overwrite the current message list.
     */
  };


  /* ----------------------------------------------------------
     MESSAGE
     ---------------------------------------------------------- */

  socket.onmessage = event => {

    let data;

    try {

      data =
        JSON.parse(
          event.data
        );

    } catch (error) {

      console.error(
        "Bad WebSocket data:",
        event.data
      );

      return;
    }

    console.log(
      "WebSocket event:",
      data
    );


    // --------------------------------------------------------
    // HISTORY
    // --------------------------------------------------------

    if (
      data.type ===
      "history"
    ) {

      socketHasReceivedHistory =
        true;

      const incoming =
        Array.isArray(
          data.messages
        )
          ? data.messages
          : [];

      /*
       * Only replace the local list with history if this is
       * the initial history event.
       *
       * This prevents a duplicate history response from
       * destroying messages that arrived live.
       */

      messages =
        normalizeMessages(
          incoming
        );

      renderMessages();

      return;
    }


    // --------------------------------------------------------
    // NEW MESSAGE
    // --------------------------------------------------------

    if (
      data.type ===
      "message"
    ) {

      /*
       * New Worker format:
       *
       * data.message
       *
       * Older format:
       *
       * data itself
       *
       * Support both.
       */

      const incoming =
        data.message &&
        typeof data.message ===
          "object"
          ? data.message
          : data;

      const message =
        normalizeMessage(
          incoming
        );

      if (!message) {
        return;
      }

      /*
       * Avoid duplicates.
       */

      const exists =
        messages.some(
          m =>
            String(m.id) ===
            String(message.id)
        );

      if (!exists) {

        messages.push(
          message
        );

        messages.sort(
          (a, b) =>
            Number(
              a.created_at || 0
            ) -
            Number(
              b.created_at || 0
            )
        );

        renderMessages();

        scrollToBottom();
      }

      return;
    }


    // --------------------------------------------------------
    // EDIT
    // --------------------------------------------------------

    if (
      data.type ===
      "message_edit"
    ) {

      const incoming =
        data.message &&
        typeof data.message ===
          "object"
          ? data.message
          : data;

      const updated =
        normalizeMessage(
          incoming
        );

      if (!updated) {
        return;
      }

      const index =
        messages.findIndex(
          m =>
            String(m.id) ===
            String(updated.id)
        );

      if (index !== -1) {

        messages[index] =
          updated;

        renderMessages();
      }

      return;
    }


    // --------------------------------------------------------
    // DELETE
    // --------------------------------------------------------

    if (
      data.type ===
      "message_delete"
    ) {

      const id =
        data.id;

      messages =
        messages.filter(
          m =>
            String(m.id) !==
            String(id)
        );

      renderMessages();

      return;
    }


    // --------------------------------------------------------
    // MEMBERS
    // --------------------------------------------------------

    if (
      data.type ===
      "members"
    ) {

      members =
        Array.isArray(
          data.members
        )
          ? data.members
          : [];

      renderMembers();

      return;
    }


    // --------------------------------------------------------
    // SERVER ERROR
    // --------------------------------------------------------

    if (
      data.type ===
      "error"
    ) {

      alert(
        data.message ||
        "Something went wrong."
      );

      return;
    }
  };


  /* ----------------------------------------------------------
     CLOSE
     ---------------------------------------------------------- */

  socket.onclose = event => {

    console.log(
      "WebSocket closed:",
      event.code,
      event.reason
    );

    currentlyConnecting = false;

    document
      .getElementById(
        "sendButton"
      )
      .disabled = true;

    if (
      !intentionalDisconnect
    ) {

      setStatus(
        false,
        "Disconnected"
      );

      scheduleReconnect();
    }
  };


  /* ----------------------------------------------------------
     ERROR
     ---------------------------------------------------------- */

  socket.onerror = error => {

    console.error(
      "WebSocket error:",
      error
    );

    setStatus(
      false,
      "Connection error"
    );
  };
}


/* ============================================================
   RECONNECT
   ============================================================ */

function scheduleReconnect() {

  clearTimeout(
    reconnectTimer
  );

  reconnectTimer =
    setTimeout(
      () => {

        if (
          currentRoom
        ) {

          connectToRoom(
            currentRoom
          );
        }

      },
      reconnectDelay
    );

  reconnectDelay =
    Math.min(
      reconnectDelay * 2,
      10000
    );
}


/* ============================================================
   SEND MESSAGE
   ============================================================ */

function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if (!text) {
    return;
  }

  if (
    !socket ||
    socket.readyState !==
      WebSocket.OPEN
  ) {

    alert(
      "Chat is still connecting. Please wait a moment."
    );

    return;
  }

  socket.send(
    JSON.stringify({
      action: "message",
      text
    })
  );

  input.value = "";

  input.style.height =
    "auto";
}


/* ============================================================
   NORMALIZE MESSAGE
   ============================================================ */

function normalizeMessage(
  message
) {

  if (
    !message ||
    typeof message !==
      "object"
  ) {
    return null;
  }

  const text =
    message.text ??
    message.message ??
    message.content ??
    "";

  return {
    id:
      String(
        message.id ??
        crypto.randomUUID()
      ),

    username:
      String(
        message.username ??
        message.name ??
        "Guest"
      ),

    avatar:
      String(
        message.avatar ??
        ""
      ),

    text:
      String(text),

    created_at:
      Number(
        message.created_at ??
        message.timestamp ??
        Date.now()
      ),

    edited:
      Boolean(
        message.edited
      ),

    pinned:
      Boolean(
        message.pinned
      )
  };
}


function normalizeMessages(
  list
) {

  return list
    .map(
      normalizeMessage
    )
    .filter(
      Boolean
    );
}


/* ============================================================
   RENDER MESSAGES
   ============================================================ */

function renderMessages() {

  const chat =
    document.getElementById(
      "chat"
    );

  chat.innerHTML = "";

  for (
    const message of messages
  ) {

    const wrapper =
      document.createElement(
        "div"
      );

    wrapper.className =
      "message" +
      (
        message.pinned
          ? " pinned"
          : ""
      );

    // Avatar.
    if (message.avatar) {

      const img =
        document.createElement(
          "img"
        );

      img.className =
        "avatar";

      img.src =
        message.avatar;

      img.onerror =
        () => {
          img.replaceWith(
            createAvatarPlaceholder(
              message.username
            )
          );
        };

      wrapper.appendChild(
        img
      );

    } else {

      wrapper.appendChild(
        createAvatarPlaceholder(
          message.username
        )
      );
    }


    const content =
      document.createElement(
        "div"
      );

    content.className =
      "message-content";


    // Header.
    const header =
      document.createElement(
        "div"
      );

    header.className =
      "message-header";


    const usernameEl =
      document.createElement(
        "span"
      );

    usernameEl.className =
      "username";

    usernameEl.textContent =
      message.username;


    const time =
      document.createElement(
        "span"
      );

    time.className =
      "timestamp";

    time.textContent =
      formatTime(
        message.created_at
      );


    header.appendChild(
      usernameEl
    );

    header.appendChild(
      time
    );


    // Edited label.
    if (message.edited) {

      const edited =
        document.createElement(
          "span"
        );

      edited.className =
        "edited";

      edited.textContent =
        "(edited)";

      header.appendChild(
        edited
      );
    }


    // Actions.
    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "message-actions";

    actions.style.marginLeft =
      "auto";


    // Edit.
    if (
      message.username ===
      username
    ) {

      const editButton =
        document.createElement(
          "button"
        );

      editButton.textContent =
        "Edit";

      editButton.onclick =
        () =>
          editMessage(
            message.id,
            message.text
          );

      actions.appendChild(
        editButton
      );


      // Delete.
      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.textContent =
        "Delete";

      deleteButton.onclick =
        () =>
          deleteMessage(
            message.id
          );

      actions.appendChild(
        deleteButton
      );


      // Pin.
      const pinButton =
        document.createElement(
          "button"
        );

      pinButton.textContent =
        message.pinned
          ? "Unpin"
          : "Pin";

      pinButton.onclick =
        () =>
          pinMessage(
            message.id
          );

      actions.appendChild(
        pinButton
      );
    }


    header.appendChild(
      actions
    );


    // Message text.
    const text =
      document.createElement(
        "div"
      );

    text.className =
      "message-text";

    text.textContent =
      message.text;


    content.appendChild(
      header
    );

    content.appendChild(
      text
    );

    wrapper.appendChild(
      content
    );

    chat.appendChild(
      wrapper
    );
  }

  scrollToBottom();
}


/* ============================================================
   AVATAR PLACEHOLDER
   ============================================================ */

function createAvatarPlaceholder(
  name
) {

  const el =
    document.createElement(
      "div"
    );

  el.className =
    "avatar-placeholder";

  el.textContent =
    String(name || "G")
      .charAt(0)
      .toUpperCase();

  return el;
}


/* ============================================================
   TIME
   ============================================================ */

function formatTime(
  timestamp
) {

  const date =
    new Date(
      Number(timestamp)
    );

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "";
  }

  return date.toLocaleTimeString(
    [],
    {
      hour: "numeric",
      minute: "2-digit"
    }
  );
}


/* ============================================================
   SCROLL
   ============================================================ */

function scrollToBottom() {

  const chat =
    document.getElementById(
      "chat"
    );

  requestAnimationFrame(
    () => {
      chat.scrollTop =
        chat.scrollHeight;
    }
  );
}


/* ============================================================
   MEMBERS
   ============================================================ */

function renderMembers() {

  const list =
    document.getElementById(
      "memberList"
    );

  list.innerHTML = "";

  for (
    const member of members
  ) {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "member";


    const dot =
      document.createElement(
        "span"
      );

    dot.className =
      "member-dot";


    const name =
      document.createElement(
        "span"
      );

    name.className =
      "member-name";

    name.textContent =
      member.username ||
      "Guest";


    row.appendChild(
      dot
    );

    name.style.flex = "1";

    row.appendChild(
      name
    );

    list.appendChild(
      row
    );
  }
}


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(
  connected,
  text
) {

  const el =
    document.getElementById(
      "connectionStatus"
    );

  el.textContent =
    text ||
    (
      connected
        ? "Connected"
        : "Disconnected"
    );

  el.className =
    "status " +
    (
      connected
        ? "connected"
        : "disconnected"
    );
}


/* ============================================================
   CREATE ROOM
   ============================================================ */

function openCreateRoom() {

  document
    .getElementById(
      "createRoomModal"
    )
    .classList.add(
      "show"
    );
}


function closeCreateRoom() {

  document
    .getElementById(
      "createRoomModal"
    )
    .classList.remove(
      "show"
    );
}


async function confirmCreateRoom() {

  const name =
    document
      .getElementById(
        "newRoomName"
      )
      .value
      .trim();

  const code =
    document
      .getElementById(
        "newRoomCode"
      )
      .value
      .trim()
      .toLowerCase();

  if (!name || !code) {

    alert(
      "Enter a room name and room code."
    );

    return;
  }

  try {

    const response =
      await fetch(
        "/api/rooms",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              name,
              code
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      alert(
        data.error ||
        "Could not create room."
      );

      return;
    }

    closeCreateRoom();

    document
      .getElementById(
        "newRoomName"
      )
      .value = "";

    document
      .getElementById(
        "newRoomCode"
      )
      .value = "";

    await loadRooms();

    joinRoom(
      data.room.code,
      data.room.name
    );

  } catch (error) {

    console.error(
      error
    );

    alert(
      "Could not create room."
    );
  }
}


/* ============================================================
   CHANGE NAME
   ============================================================ */

function changeName() {

  const value =
    prompt(
      "Enter your display name:",
      username
    );

  if (
    value === null
  ) {
    return;
  }

  const cleaned =
    value
      .replace(/[<>]/g, "")
      .trim()
      .slice(0, 24);

  if (!cleaned) {
    return;
  }

  username =
    cleaned;

  localStorage.setItem(
    "chat_username",
    username
  );

  reconnectCurrentRoom();
}


/* ============================================================
   INITIAL NAME
   ============================================================ */

function saveName() {

  const value =
    document
      .getElementById(
        "nameInput"
      )
      .value
      .replace(/[<>]/g, "")
      .trim()
      .slice(0, 24);

  if (!value) {
    return;
  }

  username =
    value;

  localStorage.setItem(
    "chat_username",
    username
  );

  document
    .getElementById(
      "nameModal"
    )
    .classList.remove(
      "show"
    );

  connectToRoom(
    currentRoom
  );
}


/* ============================================================
   CHANGE AVATAR
   ============================================================ */

function changeAvatar() {

  const value =
    prompt(
      "Enter an image URL:",
      avatar
    );

  if (
    value === null
  ) {
    return;
  }

  const cleaned =
    value.trim();

  if (
    cleaned &&
    !(
      cleaned.startsWith(
        "https://"
      ) ||
      cleaned.startsWith(
        "http://"
      )
    )
  ) {

    alert(
      "Avatar must be an http:// or https:// image URL."
    );

    return;
  }

  avatar =
    cleaned.slice(
      0,
      500
    );

  localStorage.setItem(
    "chat_avatar",
    avatar
  );

  reconnectCurrentRoom();
}


/* ============================================================
   RECONNECT CURRENT ROOM
   ============================================================ */

function reconnectCurrentRoom() {

  if (socket) {

    intentionalDisconnect =
      true;

    try {
      socket.close();
    } catch {}

    socket = null;
  }

  setTimeout(
    () => {
      connectToRoom(
        currentRoom
      );
    },
    100
  );
}


/* ============================================================
   EDIT
   ============================================================ */

function editMessage(
  id,
  oldText
) {

  const newText =
    prompt(
      "Edit message:",
      oldText
    );

  if (
    newText === null
  ) {
    return;
  }

  const text =
    newText.trim();

  if (!text) {
    return;
  }

  if (
    !socket ||
    socket.readyState !==
      WebSocket.OPEN
  ) {
    return;
  }

  socket.send(
    JSON.stringify({
      action: "edit",
      id,
      text
    })
  );
}


/* ============================================================
   DELETE
   ============================================================ */

function deleteMessage(
  id
) {

  if (
    !confirm(
      "Delete this message?"
    )
  ) {
    return;
  }

  if (
    !socket ||
    socket.readyState !==
      WebSocket.OPEN
  ) {
    return;
  }

  socket.send(
    JSON.stringify({
      action: "delete",
      id
    })
  );
}


/* ============================================================
   PIN
   ============================================================ */

function pinMessage(
  id
) {

  if (
    !socket ||
    socket.readyState !==
      WebSocket.OPEN
  ) {
    return;
  }

  socket.send(
    JSON.stringify({
      action: "pin",
      id
    })
  );
}


/* ============================================================
   THEME
   ============================================================ */

function toggleTheme() {

  document.body.classList.toggle(
    "light"
  );

  const light =
    document.body.classList.contains(
      "light"
    );

  theme =
    light
      ? "light"
      : "dark";

  localStorage.setItem(
    "chat_theme",
    theme
  );
}


/* ============================================================
   COPY ROOM CODE
   ============================================================ */

async function copyRoomCode() {

  try {

    await navigator.clipboard.writeText(
      currentRoom
    );

    alert(
      "Room code copied: " +
      currentRoom
    );

  } catch {

    prompt(
      "Copy this room code:",
      currentRoom
    );
  }
}


/* ============================================================
   MOBILE ROOMS
   ============================================================ */

function toggleMobileRooms() {

  const sidebar =
    document.querySelector(
      ".sidebar"
    );

  if (
    window.innerWidth <= 600
  ) {

    const visible =
      sidebar.style.display !==
      "none";

    sidebar.style.display =
      visible
        ? "none"
        : "flex";
  }
}


/* ============================================================
   DEV LOGIN
   ============================================================ */

async function openDevLogin() {

  const passkey =
    prompt(
      "Developer passkey:"
    );

  if (
    passkey === null
  ) {
    return;
  }

  try {

    const response =
      await fetch(
        "/api/dev/login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              passkey
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      alert(
        data.error ||
        "Invalid passkey."
      );

      return;
    }

    localStorage.setItem(
      "dev_token",
      data.token
    );

    alert(
      "Developer login successful."
    );

  } catch {

    alert(
      "Developer login failed."
    );
  }
}


/* ============================================================
   ROOM LIST REFRESH
   ============================================================ */

/*
 * Refresh the room list periodically so rooms created by
 * another browser/device eventually appear.
 *
 * This does NOT reconnect the current WebSocket.
 */

setInterval(
  async () => {

    try {

      const oldCurrentRoom =
        currentRoom;

      await loadRooms();

      /*
       * If the current room still exists, don't reconnect.
       */

      if (
        currentRoom ===
        oldCurrentRoom
      ) {
        return;
      }

    } catch {}
  },
  5000
);


/* ============================================================
   PAGE VISIBILITY
   ============================================================ */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      !document.hidden &&
      currentRoom &&
      (
        !socket ||
        socket.readyState !==
          WebSocket.OPEN
      )
    ) {

      connectToRoom(
        currentRoom
      );
    }
  }
);

</script>
