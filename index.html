<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatroom</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0f1117;--panel:#171a23;--panel2:#1d2130;--border:#2b3040;
  --text:#f4f6fb;--muted:#9299aa;--accent:#6c8cff;--danger:#ff5d6c;
  --bubble:#252a38;--input:#12151d;
}
body.light{
  --bg:#f3f5f8;--panel:#fff;--panel2:#eef1f5;--border:#d9dee7;
  --text:#171a21;--muted:#687080;--accent:#4f6ff0;--danger:#d9364d;
  --bubble:#e8ebf1;--input:#f7f8fa;
}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;height:100vh;overflow:hidden;
}
button,input{font:inherit}
button{cursor:pointer}
.app{display:flex;height:100vh}
.sidebar{
  width:260px;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
}
.brand{
  padding:18px;font-size:20px;font-weight:700;border-bottom:1px solid var(--border);
}
.sidebar-section{padding:12px}
.section-title{
  color:var(--muted);font-size:12px;font-weight:700;
  text-transform:uppercase;margin:5px 6px 9px;
}
.room{
  padding:10px 12px;border-radius:8px;display:flex;align-items:center;
  justify-content:space-between;gap:8px;margin-bottom:4px;
}
.room:hover{background:var(--panel2)}
.room.active{background:var(--accent);color:white}
.room-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-code{font-size:10px;opacity:.7}
.add-room{
  width:100%;padding:9px;border:1px dashed var(--border);
  background:transparent;color:var(--muted);border-radius:8px;margin-top:5px;
}
.add-room:hover{color:var(--text);border-color:var(--accent)}
.sidebar-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.profile{display:flex;align-items:center;gap:10px}
.avatar{
  width:36px;height:36px;border-radius:50%;object-fit:cover;
  background:var(--panel2);display:flex;align-items:center;justify-content:center;
  overflow:hidden;font-weight:bold;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{min-width:0;flex:1}
.profile-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:11px;color:var(--muted)}
.icon-btn{
  border:0;background:transparent;color:var(--muted);padding:7px;border-radius:7px;
}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.main{display:flex;flex:1;min-width:0}
.chat{display:flex;flex-direction:column;flex:1;min-width:0}
.chat-header{
  height:62px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;padding:0 18px;gap:12px;background:var(--panel);
}
.chat-title{font-size:18px;font-weight:700}
.chat-subtitle{font-size:12px;color:var(--muted)}
.connection{margin-left:auto;font-size:12px;color:#65d48a}
.connection.off{color:var(--danger)}
.messages{
  flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px;
}
.message{display:flex;gap:10px;max-width:850px}
.message-avatar{width:34px;height:34px;flex-shrink:0}
.message-content{min-width:0}
.message-top{display:flex;align-items:center;gap:8px}
.message-user{font-size:13px;font-weight:700}
.message-time{font-size:10px;color:var(--muted)}
.message-text{
  background:var(--bubble);padding:9px 12px;border-radius:10px;
  margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere;
}
.message-actions{display:none;margin-left:5px}
.message:hover .message-actions{display:inline-flex}
.message-actions button{
  border:0;background:transparent;color:var(--muted);font-size:11px;padding:2px 4px;
}
.message-actions button:hover{color:var(--text)}
.edited{font-size:10px;color:var(--muted);margin-left:5px}
.pinned{
  border-left:3px solid var(--accent);
}
.composer{
  padding:12px 16px 16px;border-top:1px solid var(--border);background:var(--panel);
}
.composer-row{display:flex;gap:8px}
.composer input{
  flex:1;background:var(--input);border:1px solid var(--border);
  color:var(--text);padding:12px;border-radius:9px;outline:none;
}
.composer input:focus{border-color:var(--accent)}
.send{
  border:0;background:var(--accent);color:white;border-radius:9px;padding:0 18px;
}
.members{
  width:220px;background:var(--panel);border-left:1px solid var(--border);
  padding:16px;overflow-y:auto;
}
.members h3{font-size:12px;color:var(--muted);text-transform:uppercase;margin:4px 0 12px}
.member{display:flex;align-items:center;gap:8px;padding:7px 0}
.member-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.online-dot{width:7px;height:7px;background:#65d48a;border-radius:50%;margin-left:auto}
.unread{
  background:var(--danger);color:white;border-radius:10px;
  font-size:10px;padding:2px 6px;
}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;
  align-items:center;justify-content:center;z-index:20;padding:15px;
}
.modal{
  width:min(430px,100%);background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:20px;
}
.modal h2{margin:0 0 15px}
.modal input{
  width:100%;padding:11px;background:var(--input);border:1px solid var(--border);
  color:var(--text);border-radius:8px;margin-bottom:10px;outline:none;
}
.modal-buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.btn{
  padding:9px 13px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text);
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.btn.danger{background:var(--danger);border-color:var(--danger);color:white}
.dev-panel{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.hidden{display:none!important}
.emoji-row{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.emoji-row button{
  border:0;background:var(--panel2);border-radius:6px;padding:5px 7px;
}
.notice{
  margin:10px auto;padding:9px 12px;border-radius:8px;
  background:var(--panel2);color:var(--muted);font-size:12px;
}
@media(max-width:800px){
  .sidebar{width:190px}
  .members{display:none}
}
@media(max-width:560px){
  .sidebar{width:70px}
  .brand{font-size:0;text-align:center}
  .brand:after{content:"💬";font-size:22px}
  .section-title{display:none}
  .room{justify-content:center}
  .room-name{font-size:0}
  .room-name:before{content:"#";font-size:18px}
  .room-code{display:none}
  .add-room{font-size:0}
  .add-room:before{content:"+";font-size:20px}
  .profile-info,.sidebar-bottom .icon-btn{display:none}
  .sidebar-bottom{padding:8px}
  .profile{justify-content:center}
  .messages{padding:12px}
  .chat-header{padding:0 12px}
  .composer{padding:8px}
}
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">💬 Chatroom</div>

    <div class="sidebar-section">
      <div class="section-title">Rooms</div>
      <div id="rooms"></div>
      <button class="add-room" onclick="openRoomModal()">＋ Create room</button>
    </div>

    <div class="sidebar-bottom">
      <div class="profile">
        <div class="avatar" id="myAvatar">?</div>
        <div class="profile-info">
          <div class="profile-name" id="myName">Guest</div>
          <div class="status" id="myStatus">Disconnected</div>
        </div>
        <button class="icon-btn" onclick="openSettings()">⚙</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <section class="chat">
      <header class="chat-header">
        <div>
          <div class="chat-title" id="roomTitle">General</div>
          <div class="chat-subtitle" id="roomCodeLabel">#general</div>
        </div>
        <div class="connection off" id="connection">● Disconnected</div>
      </header>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <div class="emoji-row">
          <button onclick="addEmoji('😀')">😀</button>
          <button onclick="addEmoji('😂')">😂</button>
          <button onclick="addEmoji('😭')">😭</button>
          <button onclick="addEmoji('😐')">😐</button>
          <button onclick="addEmoji('❤️')">❤️</button>
          <button onclick="addEmoji('👍')">👍</button>
          <button onclick="addEmoji('🔥')">🔥</button>
          <button onclick="addEmoji('💀')">💀</button>
        </div>
        <div class="composer-row">
          <input id="messageInput" placeholder="Type a message..." maxlength="2000"
                 onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
          <button class="send" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </section>

    <aside class="members">
      <h3>Online members</h3>
      <div id="membersBar"></div>
    </aside>
  </main>
</div>

<div class="modal-backdrop" id="nameModal">
  <div class="modal">
    <h2>Welcome</h2>
    <p style="color:var(--muted);font-size:13px">Choose a display name to enter the chat.</p>
    <input id="nameInput" maxlength="24" placeholder="Display name">
    <input id="avatarInput" placeholder="Avatar URL (optional)">
    <div class="modal-buttons">
      <button class="btn primary" onclick="saveProfile()">Enter chat</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="roomModal">
  <div class="modal">
    <h2>Create a room</h2>
    <input id="roomNameInput" maxlength="40" placeholder="Room name">
    <input id="roomCodeInput" maxlength="30" placeholder="Room code">
    <div class="modal-buttons">
      <button class="btn" onclick="closeModal('roomModal')">Cancel</button>
      <button class="btn primary" onclick="createRoom()">Create</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <h2>Settings</h2>
    <input id="settingsName" maxlength="24" placeholder="Display name">
    <input id="settingsAvatar" placeholder="Avatar URL">
    <button class="btn" onclick="toggleTheme()">Toggle dark/light theme</button>

    <div class="dev-panel">
      <strong>Developer</strong>
      <p style="font-size:12px;color:var(--muted)">Developer tools are optional.</p>
      <input id="devPass" type="password" placeholder="Developer passkey">
      <button class="btn" onclick="devLogin()">Developer login</button>
      <div id="devTools" class="hidden" style="margin-top:10px"></div>
    </div>

    <div class="modal-buttons">
      <button class="btn" onclick="closeModal('settingsModal')">Close</button>
      <button class="btn primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script>
let socket=null;
let reconnectTimer=null;
let rooms=[];
let currentRoom="general";
let username=localStorage.getItem("chat_username")||"";
let avatar=localStorage.getItem("chat_avatar")||"";
let messages=[];
let members=[];
let devToken=localStorage.getItem("chat_dev_token")||"";

const $=id=>document.getElementById(id);

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function avatarHtml(name,url){
  if(url){
    return `<div class="avatar"><img src="${escapeHtml(url)}" onerror="this.parentElement.innerText='${escapeHtml((name||"?")[0].toUpperCase())}'"></div>`;
  }
  return `<div class="avatar">${escapeHtml((name||"?")[0].toUpperCase())}</div>`;
}

function setStatus(connected,text){
  $("connection").textContent=connected?"● Connected":"● "+(text||"Disconnected");
  $("connection").className="connection"+(connected?"":" off");
  $("myStatus").textContent=connected?"Online":"Disconnected";
}

function openModal(id){$(id).style.display="flex"}
function closeModal(id){$(id).style.display="none"}

function init(){
  if(!username){
    $("nameModal").style.display="flex";
  }else{
    $("myName").textContent=username;
    updateMyAvatar();
    connect();
  }

  const theme=localStorage.getItem("chat_theme");
  if(theme==="light") document.body.classList.add("light");

  loadRooms();
  setInterval(loadRooms,3000);
}

function saveProfile(){
  const name=$("nameInput").value.trim();
  if(!name)return alert("Enter a display name.");
  username=name;
  avatar=$("avatarInput").value.trim();
  localStorage.setItem("chat_username",username);
  localStorage.setItem("chat_avatar",avatar);
  $("myName").textContent=username;
  updateMyAvatar();
  closeModal("nameModal");
  connect();
}

function updateMyAvatar(){
  $("myAvatar").innerHTML="";
  if(avatar){
    const img=document.createElement("img");
    img.src=avatar;
    img.onerror=()=>{$("myAvatar").textContent=(username||"?")[0].toUpperCase()};
    $("myAvatar").appendChild(img);
  }else{
    $("myAvatar").textContent=(username||"?")[0].toUpperCase();
  }
}

async function loadRooms(){
  try{
    const res=await fetch("/api/rooms",{cache:"no-store"});
    if(!res.ok)return;
    const data=await res.json();
    if(Array.isArray(data.rooms)){
      rooms=data.rooms;
      renderRooms();
    }
  }catch(e){}
}

function renderRooms(){
  const box=$("rooms");
  box.innerHTML="";
  rooms.forEach(room=>{
    const div=document.createElement("div");
    div.className="room"+(room.code===currentRoom?" active":"");
    div.onclick=()=>joinRoom(room.code);
    div.innerHTML=`
      <span class="room-name">${escapeHtml(room.name)}</span>
      <span class="room-code">${escapeHtml(room.code)}</span>
    `;
    box.appendChild(div);
  });
}

function joinRoom(code){
  if(!code||code===currentRoom&&socket&&socket.readyState===WebSocket.OPEN)return;

  currentRoom=code;
  messages=[];
  members=[];
  renderMessages();
  renderMembers();
  renderRooms();

  if(socket){
    try{socket.close()}catch(e){}
    socket=null;
  }

  connect();
}

function connect(){
  if(!username)return;

  clearTimeout(reconnectTimer);

  setStatus(false,"Connecting...");

  const protocol=location.protocol==="https:"?"wss:":"ws:";
  const url=protocol+"//"+location.host+
    "/api/ws?room="+encodeURIComponent(currentRoom)+
    "&name="+encodeURIComponent(username)+
    "&avatar="+encodeURIComponent(avatar);

  try{
    socket=new WebSocket(url);
  }catch(e){
    scheduleReconnect();
    return;
  }

  socket.onopen=()=>{
    setStatus(true);
    loadRoomHistory();
  };

  socket.onmessage=(event)=>{
    try{
      const data=JSON.parse(event.data);

      if(data.type==="history"){
        messages=Array.isArray(data.messages)?data.messages:[];
        renderMessages();
      }

      else if(data.type==="message"){
        const msg=data.message||data;
        if(msg && msg.id && !messages.some(m=>m.id===msg.id)){
          messages.push(msg);
          renderMessages();
          scrollMessages();
        }
      }

      else if(data.type==="members"){
        members=Array.isArray(data.members)?data.members:[];
        renderMembers();
      }

      else if(data.type==="message_edit"){
        const i=messages.findIndex(m=>m.id===data.message.id);
        if(i>=0)messages[i]=data.message;
        renderMessages();
      }

      else if(data.type==="message_delete"){
        messages=messages.filter(m=>m.id!==data.id);
        renderMessages();
      }

      else if(data.type==="error"){
        alert(data.message||"Something went wrong.");
      }
    }catch(e){
      console.error("Bad server message:",e);
    }
  };

  socket.onerror=(event)=>{
    console.error("WebSocket error",event);
    setStatus(false,"Chatroom is disconnected");
  };

  socket.onclose=(event)=>{
    console.warn("WebSocket closed:",event.code,event.reason);
    setStatus(false,"Chatroom is disconnected");
    scheduleReconnect();
  };
}

function scheduleReconnect(){
  clearTimeout(reconnectTimer);
  reconnectTimer=setTimeout(()=>{
    if(username)connect();
  },3000);
}

async function loadRoomHistory(){
  try{
    const res=await fetch("/api/history?room="+encodeURIComponent(currentRoom));
    if(!res.ok)return;
    const data=await res.json();
    if(Array.isArray(data.messages)){
      messages=data.messages;
      renderMessages();
    }
  }catch(e){}
}

function sendMessage(){
  const input=$("messageInput");
  const text=input.value.trim();
  if(!text)return;

  if(!socket||socket.readyState!==WebSocket.OPEN){
    alert("The chatroom is disconnected. Please wait a moment and try again.");
    return;
  }

  socket.send(JSON.stringify({
    action:"message",
    text
  }));

  input.value="";
  input.focus();
}

function renderMessages(){
  const box=$("messages");
  box.innerHTML="";

  if(!messages.length){
    box.innerHTML=`<div class="notice">No messages yet. Say something!</div>`;
    return;
  }

  messages.forEach(msg=>{
    const div=document.createElement("div");
    div.className="message"+(msg.pinned?" pinned":"");

    const mine=msg.username===username;

    const time=msg.created_at
      ?new Date(msg.created_at).toLocaleTimeString([],{
        hour:"numeric",minute:"2-digit"
      }):"";

    div.innerHTML=`
      ${avatarHtml(msg.username,msg.avatar)}
      <div class="message-content">
        <div class="message-top">
          <span class="message-user">${escapeHtml(msg.username||"Unknown")}</span>
          <span class="message-time">${escapeHtml(time)}</span>
          ${msg.edited?'<span class="edited">(edited)</span>':""}
          <span class="message-actions">
            ${mine?`<button onclick="editMessage('${escapeHtml(msg.id)}')">edit</button>`:""}
            ${mine?`<button onclick="deleteMessage('${escapeHtml(msg.id)}')">delete</button>`:""}
            ${mine?`<button onclick="pinMessage('${escapeHtml(msg.id)}')">${msg.pinned?"unpin":"pin"}</button>`:""}
          </span>
        </div>
        <div class="message-text">${escapeHtml(msg.text||"")}</div>
      </div>
    `;
    box.appendChild(div);
  });

  scrollMessages();
}

function scrollMessages(){
  const box=$("messages");
  box.scrollTop=box.scrollHeight;
}

function renderMembers(){
  const box=$("membersBar");
  box.innerHTML="";

  members.forEach(member=>{
    const div=document.createElement("div");
    div.className="member";
    div.innerHTML=`
      ${avatarHtml(member.username||member.name,member.avatar)}
      <span class="member-name">${escapeHtml(member.username||member.name||"Guest")}</span>
      <span class="online-dot"></span>
    `;
    box.appendChild(div);
  });

  if(!members.length){
    box.innerHTML='<span style="color:var(--muted);font-size:12px">Nobody online</span>';
  }
}

function editMessage(id){
  const msg=messages.find(m=>m.id===id);
  if(!msg)return;
  const text=prompt("Edit message:",msg.text);
  if(text===null||!text.trim())return;

  if(socket?.readyState===WebSocket.OPEN){
    socket.send(JSON.stringify({
      action:"edit",
      id,
      text:text.trim()
    }));
  }
}

function deleteMessage(id){
  if(!confirm("Delete this message?"))return;

  if(socket?.readyState===WebSocket.OPEN){
    socket.send(JSON.stringify({
      action:"delete",
      id
    }));
  }
}

function pinMessage(id){
  if(socket?.readyState===WebSocket.OPEN){
    socket.send(JSON.stringify({
      action:"pin",
      id
    }));
  }
}

function addEmoji(emoji){
  const input=$("messageInput");
  input.value+=emoji;
  input.focus();
}

function openRoomModal(){
  $("roomNameInput").value="";
  $("roomCodeInput").value="";
  openModal("roomModal");
}

async function createRoom(){
  const name=$("roomNameInput").value.trim();
  let code=$("roomCodeInput").value.trim().toLowerCase();

  if(!name)return alert("Enter a room name.");

  if(!code){
    code=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  }

  if(!/^[a-z0-9_-]{2,30}$/.test(code)){
    return alert("Room code can only contain letters, numbers, _ and -.");
  }

  try{
    const res=await fetch("/api/rooms",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,code})
    });

    const data=await res.json();

    if(!res.ok)return alert(data.error||"Could not create room.");

    closeModal("roomModal");
    await loadRooms();
    joinRoom(code);
  }catch(e){
    alert("Could not create room.");
  }
}

function openSettings(){
  $("settingsName").value=username;
  $("settingsAvatar").value=avatar;
  openModal("settingsModal");
}

function saveSettings(){
  const newName=$("settingsName").value.trim();
  const newAvatar=$("settingsAvatar").value.trim();

  if(!newName)return alert("Display name cannot be empty.");

  username=newName;
  avatar=newAvatar;

  localStorage.setItem("chat_username",username);
  localStorage.setItem("chat_avatar",avatar);

  $("myName").textContent=username;
  updateMyAvatar();

  closeModal("settingsModal");

  if(socket)try{socket.close()}catch(e){}
  connect();
}

function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem(
    "chat_theme",
    document.body.classList.contains("light")?"light":"dark"
  );
}

async function devLogin(){
  const pass=$("devPass").value;

  if(!pass)return;

  try{
    const res=await fetch("/api/dev/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({passkey:pass})
    });

    const data=await res.json();

    if(!res.ok)return alert(data.error||"Developer login failed.");

    devToken=data.token;
    localStorage.setItem("chat_dev_token",devToken);
    await loadDevTools();
  }catch(e){
    alert("Developer login failed.");
  }
}

async function loadDevTools(){
  if(!devToken)return;

  try{
    const res=await fetch("/api/dev/users",{
      headers:{Authorization:"Bearer "+devToken}
    });

    if(!res.ok)return;

    const data=await res.json();
    const users=data.users||[];

    const box=$("devTools");
    box.classList.remove("hidden");

    box.innerHTML=`
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">
        Online users: ${users.length}
      </div>
      ${users.map(u=>`
        <div style="display:flex;gap:5px;align-items:center;margin-bottom:6px">
          <span style="font-size:12px;flex:1">${escapeHtml(u.username)}</span>
          <button class="btn" style="padding:4px 7px;font-size:11px"
            onclick="devAction('kick',${JSON.stringify(u.username)})">Kick</button>
          <button class="btn" style="padding:4px 7px;font-size:11px"
            onclick="devAction('timeout',${JSON.stringify(u.username)})">Timeout</button>
        </div>
      `).join("")}
    `;
  }catch(e){}
}

async function devAction(action,target){
  let seconds=0;

  if(action==="timeout"){
    seconds=parseInt(prompt("Timeout duration in seconds:", "60"),10);
    if(!Number.isFinite(seconds)||seconds<1)return;
  }

  try{
    const res=await fetch("/api/dev/action",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+devToken
      },
      body:JSON.stringify({
        action,
        target,
        seconds
      })
    });

    const data=await res.json();

    if(!res.ok)alert(data.error||"Action failed.");
    else loadDevTools();
  }catch(e){
    alert("Action failed.");
  }
}

init();
</script>
</body>
</html>
