<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #111827;
    --sidebar: #0f172a;
    --panel: #1f2937;
    --panel2: #374151;
    --text: #f9fafb;
    --muted: #9ca3af;
    --accent: #5865f2;
    --accent-hover: #4752c4;
    --border: #374151;
    --danger: #ef4444;
}

body.light {
    --bg: #f3f4f6;
    --sidebar: #ffffff;
    --panel: #ffffff;
    --panel2: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --border: #d1d5db;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    height: 100vh;
    overflow: hidden;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.sidebar-header {
    padding: 18px;
    font-size: 20px;
    font-weight: bold;
    border-bottom: 1px solid var(--border);
}

.profile {
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--panel2);
}

.profile-name {
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
}

.rooms {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

.room {
    padding: 11px 12px;
    border-radius: 7px;
    margin-bottom: 4px;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.room:hover {
    background: var(--panel);
    color: var(--text);
}

.room.active {
    background: var(--accent);
    color: white;
}

.room-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.unread {
    background: var(--danger);
    color: white;
    border-radius: 12px;
    min-width: 20px;
    padding: 2px 6px;
    font-size: 11px;
    text-align: center;
}

.sidebar-bottom {
    padding: 10px;
    border-top: 1px solid var(--border);
}

.sidebar-button {
    width: 100%;
    padding: 10px;
    margin-bottom: 7px;
    border: 0;
    border-radius: 7px;
    background: var(--panel);
    color: var(--text);
}

.sidebar-button:hover {
    background: var(--panel2);
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.chat-header {
    height: 64px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
}

.menu-button {
    display: none;
    background: transparent;
    border: 0;
    color: var(--text);
    font-size: 24px;
}

.chat-title {
    font-size: 18px;
    font-weight: bold;
}

.connection-status {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
}

.status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    margin-right: 5px;
}

.status-dot.offline {
    background: #ef4444;
}

/* MESSAGES */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
    max-width: 900px;
}

.message-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
}

.message-content {
    min-width: 0;
}

.message-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 3px;
}

.message-user {
    font-weight: bold;
}

.message-time {
    font-size: 11px;
    color: var(--muted);
}

.message-text {
    word-wrap: break-word;
    white-space: pre-wrap;
    line-height: 1.45;
}

.message-actions {
    display: flex;
    gap: 5px;
    margin-top: 6px;
}

.message-actions button {
    border: 0;
    background: var(--panel2);
    color: var(--text);
    padding: 4px 7px;
    border-radius: 5px;
    font-size: 11px;
}

.message-actions button:hover {
    opacity: .8;
}

.empty {
    text-align: center;
    color: var(--muted);
    margin-top: 80px;
}

/* INPUT */

.input-area {
    padding: 15px;
    border-top: 1px solid var(--border);
    background: var(--panel);
}

.input-row {
    display: flex;
    gap: 8px;
}

.message-input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    outline: none;
}

.message-input:focus {
    border-color: var(--accent);
}

.send-button {
    background: var(--accent);
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 0 20px;
    font-weight: bold;
}

.send-button:hover {
    background: var(--accent-hover);
}

/* MEMBERS */

.members-bar {
    display: flex;
    gap: 5px;
    margin-left: 10px;
}

.member-avatar {
    width: 27px;
    height: 27px;
    border-radius: 50%;
    object-fit: cover;
}

/* MODAL */

.modal-background {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal {
    width: min(430px, calc(100% - 30px));
    background: var(--panel);
    border-radius: 12px;
    padding: 25px;
}

.modal h2 {
    margin-top: 0;
}

.modal input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 7px;
}

.modal button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 7px;
    background: var(--accent);
    color: white;
    font-weight: bold;
}

.hidden {
    display: none !important;
}

/* ROOM MODAL */

.room-modal-buttons {
    display: flex;
    gap: 8px;
}

.room-modal-buttons button {
    flex: 1;
}

/* MOBILE */

@media (max-width: 700px) {
    .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        z-index: 50;
        transition: left .2s;
    }

    .sidebar.open {
        left: 0;
    }

    .menu-button {
        display: block;
    }

    .members-bar {
        display: none;
    }

    .messages {
        padding: 15px 10px;
    }

    .message {
        gap: 8px;
    }

    .message-avatar {
        width: 34px;
        height: 34px;
    }

    .input-area {
        padding: 10px;
    }

    .send-button {
        padding: 0 14px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            💬 Chat Room
        </div>

        <div class="profile">
            <img id="profileAvatar" class="avatar" src="">
            <div>
                <div id="profileName" class="profile-name">Guest</div>
                <small style="color:var(--muted)">Online</small>
            </div>
        </div>

        <div class="rooms" id="rooms"></div>

        <div class="sidebar-bottom">
            <button class="sidebar-button" onclick="createRoom()">
                ＋ New Room
            </button>

            <button class="sidebar-button" onclick="toggleTheme()">
                🌓 Theme
            </button>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="chat-header">

            <button class="menu-button" onclick="toggleSidebar()">
                ☰
            </button>

            <div class="chat-title" id="chatTitle">
                #general
            </div>

            <div class="members-bar" id="membersBar"></div>

            <div class="connection-status">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">Connected</span>
            </div>

        </header>

        <div class="messages" id="messages"></div>

        <div class="input-area">

            <div class="input-row">

                <input
                    id="messageInput"
                    class="message-input"
                    placeholder="Message #general"
                    autocomplete="off"
                >

                <button
                    class="send-button"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>

        </div>

    </main>

</div>


<!-- LOGIN MODAL -->

<div class="modal-background" id="loginModal">

    <div class="modal">

        <h2>Join the chat</h2>

        <p style="color:var(--muted)">
            Choose a display name and optional avatar.
        </p>

        <input
            id="nameInput"
            placeholder="Display name"
            maxlength="30"
        >

        <input
            id="avatarInput"
            placeholder="Avatar URL (optional)"
        >

        <button onclick="login()">
            Enter Chat
        </button>

    </div>

</div>


<!-- ROOM MODAL -->

<div class="modal-background hidden" id="roomModal">

    <div class="modal">

        <h2>Create a room</h2>

        <input
            id="roomNameInput"
            placeholder="Room name"
            maxlength="30"
        >

        <input
            id="roomCodeInput"
            placeholder="Room code"
            maxlength="30"
        >

        <div class="room-modal-buttons">

            <button onclick="confirmCreateRoom()">
                Create
            </button>

            <button
                onclick="closeRoomModal()"
                style="background:var(--panel2)"
            >
                Cancel
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   STATE
========================= */

let username = "";
let avatar = "";

let currentRoom = "general";

let socket = null;

let messages = [];

let members = [];

let rooms = [
    {
        name: "General",
        code: "general"
    }
];

let unread = {};

let reconnectTimer = null;


/* =========================
   ELEMENTS
========================= */

const messagesElement =
    document.getElementById("messages");

const roomsElement =
    document.getElementById("rooms");

const messageInput =
    document.getElementById("messageInput");

const chatTitle =
    document.getElementById("chatTitle");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

const membersBar =
    document.getElementById("membersBar");


/* =========================
   AVATAR
========================= */

function getAvatar(name, customAvatar) {

    if (customAvatar && customAvatar.trim()) {
        return customAvatar;
    }

    return "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(name) +
        "&background=5865f2&color=fff";
}


/* =========================
   LOGIN
========================= */

function login() {

    const name =
        document.getElementById("nameInput")
            .value
            .trim();

    const avatarUrl =
        document.getElementById("avatarInput")
            .value
            .trim();

    if (!name) {
        alert("Please enter a display name.");
        return;
    }

    username = name;
    avatar = avatarUrl;

    localStorage.setItem(
        "chat_username",
        username
    );

    localStorage.setItem(
        "chat_avatar",
        avatar
    );

    document.getElementById("profileName")
        .textContent = username;

    document.getElementById("profileAvatar")
        .src = getAvatar(username, avatar);

    document.getElementById("loginModal")
        .classList.add("hidden");

    connect();
}


/* =========================
   AUTO LOGIN
========================= */

function loadSavedUser() {

    const savedName =
        localStorage.getItem("chat_username");

    const savedAvatar =
        localStorage.getItem("chat_avatar");

    if (savedName) {

        username = savedName;
        avatar = savedAvatar || "";

        document.getElementById("profileName")
            .textContent = username;

        document.getElementById("profileAvatar")
            .src = getAvatar(username, avatar);

        document.getElementById("loginModal")
            .classList.add("hidden");

        connect();

    } else {

        document.getElementById("loginModal")
            .classList.remove("hidden");
    }
}


/* =========================
   WEBSOCKET
========================= */

function connect() {

    if (socket) {
        try {
            socket.close();
        } catch {}
    }

    setStatus(false, "Connecting...");

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    const url =
        protocol +
        "//" +
        location.host +
        "/api/ws?room=" +
        encodeURIComponent(currentRoom) +
        "&name=" +
        encodeURIComponent(username) +
        "&avatar=" +
        encodeURIComponent(avatar);

    socket = new WebSocket(url);


    socket.onopen = () => {

        setStatus(true, "Connected");

        console.log(
            "Connected to room:",
            currentRoom
        );

    };


    /*
     * IMPORTANT:
     * Everything received from the server is
     * immediately rendered here.
     *
     * This is what makes the chat live.
     */

    socket.onmessage = (event) => {

        try {

            const data =
                JSON.parse(event.data);


            /* HISTORY */

            if (data.type === "history") {

                messages =
                    data.messages || [];

                renderMessages();

                return;
            }


            /* NEW MESSAGE */

            if (data.type === "message") {

                const newMessage =
                    data.message;

                /*
                 * Prevent duplicates.
                 */
                if (
                    !messages.some(
                        m => m.id === newMessage.id
                    )
                ) {

                    messages.push(newMessage);

                }

                renderMessages();

                /*
                 * Automatically move to
                 * newest message.
                 */
                requestAnimationFrame(() => {

                    messagesElement.scrollTop =
                        messagesElement.scrollHeight;

                });

                /*
                 * If the user is looking at another
                 * browser tab, show unread count.
                 */
                if (document.hidden) {

                    unread[currentRoom] =
                        (unread[currentRoom] || 0) + 1;

                    renderRooms();
                    updatePageTitle();

                }

                return;
            }


            /* EDIT */

            if (data.type === "edit") {

                const message =
                    messages.find(
                        m => m.id === data.id
                    );

                if (message) {

                    message.message =
                        data.message;

                    renderMessages();
                }

                return;
            }


            /* DELETE */

            if (data.type === "delete") {

                messages =
                    messages.filter(
                        m => m.id !== data.id
                    );

                renderMessages();

                return;
            }


            /* PIN */

            if (data.type === "pin") {

                const message =
                    messages.find(
                        m => m.id === data.id
                    );

                if (message) {

                    message.pinned =
                        data.pinned;

                    renderMessages();
                }

                return;
            }


            /* MEMBERS */

            if (data.type === "members") {

                members =
                    data.members || [];

                renderMembers();

                return;
            }


            /* MEMBER JOIN */

            if (data.type === "member_joined") {

                renderMembers();

                return;
            }


            /* MEMBER LEFT */

            if (data.type === "member_left") {

                renderMembers();

                return;
            }


        } catch (error) {

            console.error(
                "WebSocket error:",
                error
            );

        }

    };


    socket.onclose = () => {

        setStatus(false, "Disconnected");

        console.log(
            "Disconnected. Reconnecting..."
        );

        clearTimeout(reconnectTimer);

        reconnectTimer =
            setTimeout(() => {

                connect();

            }, 2000);

    };


    socket.onerror = () => {

        setStatus(false, "Connection error");

    };
}


/* =========================
   STATUS
========================= */

function setStatus(online, text) {

    statusText.textContent = text;

    if (online) {

        statusDot.classList.remove(
            "offline"
        );

    } else {

        statusDot.classList.add(
            "offline"
        );

    }
}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) return;

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        alert("Not connected to the chat yet.");

        return;
    }

    socket.send(
        JSON.stringify({
            type: "message",
            message: text
        })
    );

    messageInput.value = "";

    messageInput.focus();
}


/* ENTER TO SEND */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages() {

    if (!messages.length) {

        messagesElement.innerHTML =
            `<div class="empty">
                No messages yet.<br>
                Start the conversation!
            </div>`;

        return;
    }


    messagesElement.innerHTML =
        messages.map(message => {

            const image =
                getAvatar(
                    message.username,
                    message.avatar
                );

            const time =
                new Date(
                    message.created_at
                ).toLocaleTimeString(
                    [],
                    {
                        hour: "numeric",
                        minute: "2-digit"
                    }
                );

            const safeText =
                escapeHTML(
                    message.message
                );

            const isMine =
                message.username === username;


            return `
                <div
                    class="message"
                    data-id="${message.id}"
                >

                    <img
                        class="message-avatar"
                        src="${escapeAttribute(image)}"
                        onerror="this.src='https://ui-avatars.com/api/?name=User'"
                    >

                    <div class="message-content">

                        <div class="message-top">

                            <span class="message-user">
                                ${escapeHTML(message.username)}
                            </span>

                            <span class="message-time">
                                ${time}
                            </span>

                            ${
                                message.pinned
                                ? `<span style="font-size:12px">
                                    📌
                                  </span>`
                                : ""
                            }

                        </div>

                        <div class="message-text">
                            ${safeText}
                        </div>

                        ${
                            isMine
                            ? `
                            <div class="message-actions">

                                <button
                                    onclick="editMessage(${message.id})"
                                >
                                    Edit
                                </button>

                                <button
                                    onclick="deleteMessage(${message.id})"
                                >
                                    Delete
                                </button>

                                <button
                                    onclick="pinMessage(${message.id})"
                                >
                                    ${message.pinned ? "Unpin" : "Pin"}
                                </button>

                            </div>
                            `
                            : ""
                        }

                    </div>

                </div>
            `;

        }).join("");
}


/* =========================
   EDIT
========================= */

function editMessage(id) {

    const message =
        messages.find(
            m => m.id === id
        );

    if (!message) return;

    const newText =
        prompt(
            "Edit message:",
            message.message
        );

    if (
        newText === null ||
        !newText.trim()
    ) return;

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify({
                type: "edit",
                id: id,
                message: newText.trim()
            })
        );

    }
}


/* =========================
   DELETE
========================= */

function deleteMessage(id) {

    if (
        !confirm(
            "Delete this message?"
        )
    ) return;

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify({
                type: "delete",
                id: id
            })
        );

    }
}


/* =========================
   PIN
========================= */

function pinMessage(id) {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify({
                type: "pin",
                id: id
            })
        );

    }
}


/* =========================
   MEMBERS
========================= */

function renderMembers() {

    membersBar.innerHTML =
        members
            .slice(0, 8)
            .map(member => {

                return `
                    <img
                        class="member-avatar"
                        title="${escapeAttribute(member.username)}"
                        src="${escapeAttribute(
                            getAvatar(
                                member.username,
                                member.avatar
                            )
                        )}"
                    >
                `;

            })
            .join("");
}


/* =========================
   ROOMS
========================= */

function renderRooms() {

    roomsElement.innerHTML =
        rooms.map(room => {

            const count =
                unread[room.code] || 0;

            return `
                <div
                    class="room ${
                        room.code === currentRoom
                        ? "active"
                        : ""
                    }"
                    onclick="joinRoom('${escapeAttribute(room.code)}')"
                >

                    <span class="room-name">
                        # ${escapeHTML(room.name)}
                    </span>

                    ${
                        count
                        ? `<span class="unread">${count}</span>`
                        : ""
                    }

                </div>
            `;

        }).join("");
}


/* =========================
   JOIN ROOM
========================= */

function joinRoom(code) {

    if (code === currentRoom) {

        unread[code] = 0;

        renderRooms();

        return;
    }

    const room =
        rooms.find(
            r => r.code === code
        );

    if (!room) return;

    currentRoom = code;

    unread[code] = 0;

    chatTitle.textContent =
        "# " + room.name;

    messageInput.placeholder =
        "Message #" + room.name;

    messages = [];

    members = [];

    renderMessages();
    renderMembers();
    renderRooms();

    /*
     * Reconnect WebSocket to the new room.
     */
    connect();

    /*
     * Close mobile sidebar.
     */
    document
        .getElementById("sidebar")
        .classList.remove("open");
}


/* =========================
   CREATE ROOM
========================= */

function createRoom() {

    document
        .getElementById("roomModal")
        .classList.remove("hidden");

    document
        .getElementById("roomNameInput")
        .focus();
}


function closeRoomModal() {

    document
        .getElementById("roomModal")
        .classList.add("hidden");
}


function confirmCreateRoom() {

    const name =
        document
            .getElementById("roomNameInput")
            .value
            .trim();

    let code =
        document
            .getElementById("roomCodeInput")
            .value
            .trim()
            .toLowerCase();

    if (!name) {

        alert("Enter a room name.");

        return;
    }

    if (!code) {

        code =
            name
                .toLowerCase()
                .replace(/[^a-z0-9_-]/g, "-");
    }

    if (
        rooms.some(
            room => room.code === code
        )
    ) {

        alert("That room already exists.");

        return;
    }

    rooms.push({
        name,
        code
    });

    closeRoomModal();

    document
        .getElementById("roomNameInput")
        .value = "";

    document
        .getElementById("roomCodeInput")
        .value = "";

    renderRooms();

    joinRoom(code);
}


/* =========================
   THEME
========================= */

function toggleTheme() {

    document.body.classList.toggle(
        "light"
    );

    localStorage.setItem(
        "chat_theme",
        document.body.classList.contains("light")
            ? "light"
            : "dark"
    );
}


function loadTheme() {

    const theme =
        localStorage.getItem("chat_theme");

    if (theme === "light") {

        document.body.classList.add(
            "light"
        );

    }

}


/* =========================
   MOBILE SIDEBAR
========================= */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");
}


/* =========================
   UNREAD
========================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (!document.hidden) {

            unread[currentRoom] = 0;

            renderRooms();

            updatePageTitle();

        }

    }
);


function updatePageTitle() {

    const total =
        Object.values(unread)
            .reduce(
                (sum, value) => sum + value,
                0
            );

    document.title =
        total > 0
            ? `(${total}) Chat Room`
            : "Chat Room";
}


/* =========================
   SECURITY / HTML ESCAPING
========================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeAttribute(value) {

    return escapeHTML(value);
}


/* =========================
   START
========================= */

loadTheme();

renderRooms();

loadSavedUser();

</script>

</body>
</html>
